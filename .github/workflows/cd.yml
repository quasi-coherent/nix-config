# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
jobs:
  flake-update:
    name: flake-update
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./.github/actions/setup
        with:
          cachixAuthToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: flake-update
        uses: ./.github/actions/flake-update
        with:
          ghPersonalAccessToken: ${{ secrets.GH_PAT }}
          gitPgpPassphrase: ${{ secrets.PGP_PASSPHRASE }}
          gitPgpPrivateKey: ${{ secrets.PGP_PRIVATE_KEY }}
name: cd
"on":
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
